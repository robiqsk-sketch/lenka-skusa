# Netlify (už nepoužívané — web beží na Cloudflare Pages, hlavičky sú v robiq-app/_headers).
# Ponechané pre prípad návratu: nasadzuje priečinok robiq-app/ (statické súbory, bez build kroku).
[build]
  publish = "robiq-app"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
