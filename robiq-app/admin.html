<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robiq — štatistika</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi">
  <style>
    /* Admin dashboard: reads analytics_summary() (schema.sql). Only e-mails in table `admins` get data. */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Satoshi', system-ui, sans-serif; background: #EEEBF7; color: #17122E; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font-size: 22px; margin: 0; } h1 b { color: #40319F; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .seg { display: inline-flex; background: rgba(36,27,69,.07); border-radius: 10px; padding: 3px; }
    .seg button { border: none; background: transparent; color: #6E688C; font: inherit; font-weight: 700; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: #40319F; color: #fff; }
    .card { background: #fff; border: 1px solid #DEDBEC; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
    .sec { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6E688C; font-weight: 700; margin: 0 0 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: rgba(85,70,196,.06); border-radius: 12px; padding: 12px 14px; }
    .tile .n { font-size: 26px; font-weight: 700; color: #40319F; line-height: 1.1; }
    .tile .l { font-size: 12px; color: #6E688C; margin-top: 4px; }
    .funnel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .funnel .row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
    .funnel .row .lbl { width: 130px; color: #6E688C; }
    .funnel .row .bar { flex: 1; height: 14px; background: rgba(36,27,69,.07); border-radius: 7px; overflow: hidden; }
    .funnel .row .bar i { display: block; height: 100%; background: #40319F; border-radius: 7px; }
    .funnel .row .val { width: 60px; text-align: right; font-weight: 700; }
    .funnel h3 { margin: 0 0 6px; font-size: 14px; }
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 16px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; position: relative; min-width: 0; }
    .chart .col .v { background: #40319F; border-radius: 4px 4px 0 0; min-height: 2px; }
    .chart .col .v.b { background: #15803D; opacity: .8; margin-top: 2px; border-radius: 0; }
    .chart .col .d { font-size: 10px; color: #6E688C; text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; }
    .chart .col .tip { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; color: #40319F; }
    .legend { font-size: 12px; color: #6E688C; margin-top: 8px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin: 0 4px 0 10px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; } .kv b { color: #40319F; }
    .login { max-width: 360px; margin: 60px auto; }
    .input { width: 100%; border: 1px solid #DEDBEC; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 14px; margin-bottom: 10px; }
    .btn { width: 100%; border: none; background: #40319F; color: #fff; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn.ghost { background: transparent; color: #6E688C; width: auto; padding: 6px 10px; font-size: 12.5px; }
    .err { color: #DC2626; font-size: 12.5px; font-weight: 700; min-height: 16px; margin: 4px 0 8px; }
    .muted { color: #6E688C; font-size: 12.5px; }
    @media (max-width: 640px) { .funnel { grid-template-columns: 1fr; } .chart .col:nth-child(even) .d { visibility: hidden; } }
    /* tabs + tables (Firmy / Inzeráty) */
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .tabs button { border: 1px solid #DEDBEC; background: #fff; color: #6E688C; font: inherit; font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 99px; cursor: pointer; }
    .tabs button.on { background: #40319F; border-color: #40319F; color: #fff; }
    .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .tools .input { margin: 0; width: auto; flex: 1; min-width: 180px; padding: 9px 12px; font-size: 13px; }
    .tools label { font-size: 12.5px; color: #6E688C; display: flex; align-items: center; gap: 6px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6E688C; padding: 8px 10px; border-bottom: 1px solid #DEDBEC; white-space: nowrap; }
    .tbl td { padding: 10px; border-bottom: 1px solid #EEEBF7; vertical-align: top; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl .num { text-align: right; white-space: nowrap; }
    .tbl .sub { color: #6E688C; font-size: 11.5px; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
    .tag.ok { background: rgba(21,128,61,.12); color: #15803D; }
    .tag.warn { background: rgba(180,83,9,.12); color: #B45309; }
    .tag.err { background: rgba(220,38,38,.12); color: #DC2626; }
    .tag.off { background: rgba(36,27,69,.07); color: #6E688C; }
    .act { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { border: 1px solid #DEDBEC; background: #fff; color: #3F3A55; font: inherit; font-weight: 700; font-size: 11.5px; padding: 6px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .mini:hover { border-color: #40319F; color: #40319F; }
    .mini.danger:hover { border-color: #DC2626; color: #DC2626; }
    .tblwrap { overflow-x: auto; }
    details summary { cursor: pointer; color: #40319F; font-size: 12px; }
    details p { margin: 6px 0 0; font-size: 12.5px; white-space: pre-wrap; }
    .tbl td:first-child { min-width: 220px; }
    /* Dark theme — follows the app's setting (localStorage robiq_theme) or the system */
    html.theme-dark { color-scheme: dark; }
    html.theme-dark body { background: #110D24; color: #F3F1FA; }
    html.theme-dark .card, html.theme-dark .mini, html.theme-dark .tabs button { background: #1B1636; border-color: #2F2852; color: #F3F1FA; }
    html.theme-dark .tabs button.on { background: #7B6BEE; border-color: #7B6BEE; color: #fff; }
    html.theme-dark .tile { background: rgba(255,255,255,.06); }
    html.theme-dark .tile .n, html.theme-dark .kv b, html.theme-dark details summary, html.theme-dark .chart .col .tip { color: #A093FF; }
    html.theme-dark .tile .l, html.theme-dark .muted, html.theme-dark .sec, html.theme-dark .tbl th, html.theme-dark .tbl .sub, html.theme-dark .funnel .row .lbl, html.theme-dark .tools label, html.theme-dark .seg button, html.theme-dark .btn.ghost, html.theme-dark .legend { color: #9B95B8; }
    html.theme-dark .seg { background: rgba(255,255,255,.08); } html.theme-dark .seg button.on { background: #7B6BEE; color: #fff; }
    html.theme-dark .input { background: #1B1636; border-color: #2F2852; color: #F3F1FA; }
    html.theme-dark .tbl th, html.theme-dark .tbl td, html.theme-dark .tbl tr { border-color: #2F2852; }
    html.theme-dark .funnel .row .bar { background: rgba(255,255,255,.08); }
    html.theme-dark .tag.off { background: rgba(255,255,255,.08); color: #9B95B8; }
    html.theme-dark .btn { background: #7B6BEE; }
    html.theme-dark #google { background: #1B1636 !important; color: #F3F1FA !important; border-color: #2F2852 !important; }
    /* Phones: each table row becomes a card — cells stack, numbers go inline with a label */
    @media (max-width: 700px) {
      .tblwrap { overflow: visible; }
      .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; }
      .tbl thead { display: none; }
      .tbl tr { border: 1px solid #EEEBF7; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
      .tbl td { padding: 3px 0; border: none; min-width: 0; }
      .tbl td.num { display: inline-block; text-align: left; margin-right: 14px; }
      .tbl td.num::before { content: attr(data-l) ': '; color: #6E688C; font-size: 11.5px; }
      .tbl td:last-child { padding-top: 8px; }
      .top { margin-bottom: 14px; } .seg button { padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Robiq<b>.</b> admin</h1>
      <div id="controls" hidden>
        <span class="seg" id="seg"><button data-days="7" class="on">7 dní</button><button data-days="30">30 dní</button><button data-days="90">90 dní</button></span>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← Späť do appky</a>
        <button class="btn ghost" id="logout">Odhlásiť</button>
      </div>
    </div>
    <div class="tabs" id="tabs" hidden>
      <button data-tab="stats" class="on">Štatistika</button><button data-tab="companies">Firmy</button><button data-tab="postings">Inzeráty</button><button data-tab="reports">Nahlásenia<span id="rep-badge"></span></button>
    </div>

    <div class="card login" id="login">
      <p class="muted" style="margin-top:0">Prihlás sa účtom, ktorý je v zozname adminov.</p>
      <form id="form">
        <input class="input" type="email" id="email" placeholder="E-mail" autocomplete="email">
        <input class="input" type="password" id="pass" placeholder="Heslo" autocomplete="current-password">
        <div class="err" id="login-err"></div>
        <button class="btn" type="submit">Prihlásiť sa</button>
      </form>
      <p class="muted" style="text-align:center;margin:12px 0">alebo</p>
      <button class="btn" id="google" type="button" style="background:#fff;color:#17122E;border:1px solid #DEDBEC">Pokračovať s Google</button>
    </div>

    <div id="dash" hidden></div>
    <p class="muted" id="foot" hidden style="text-align:center;margin-top:28px"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(ROBIQ_CONFIG.supabaseUrl, ROBIQ_CONFIG.supabaseAnonKey);
    try { const p = localStorage.getItem('robiq_theme'); document.documentElement.classList.toggle('theme-dark', p ? p === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches); } catch {}
    let days = 7;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fmtDay = iso => { const d = new Date(iso); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
    const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';

    // Registration funnel: started → step 2 → step 3 → done, per role (d.reg = { "reg_start:student": n, "reg_step:student:2": n, … }).
    function funnel(title, role, reg) {
      const g = k => reg[k] || 0;
      const steps = [['Začali registráciu', g('reg_start:' + role)], ['Krok 2', g('reg_step:' + role + ':2')],
                     ['Krok 3', g('reg_step:' + role + ':3')], ['Dokončili', g('reg_done:' + role)]];
      const max = Math.max(1, ...steps.map(s => s[1]));
      return `<div><h3>${title}</h3>${steps.map(([l, v], i) => `<div class="row"><span class="lbl">${l}</span><span class="bar"><i style="width:${v / max * 100}%"></i></span><span class="val">${v}${i ? ' <span class="muted">' + pct(v, steps[0][1]) + '</span>' : ''}</span></div>`).join('')}</div>`;
    }

    // Denná afirmácia pre admin tím — vyberá sa podľa dňa v roku, takže celý deň je rovnaká.
    const AFFIRMATIONS = [
      'Dnes si presne tam, kde máš byť. Teda pri notebooku. S kávou. Ako vždy.',
      'Každý bug je len feature, ktorú ešte nikto nepochopil.',
      'Si dosť dobrá. Si dosť dobrý. Robiq je dosť dobrý. Supabase… uvidíme.',
      'Rím nepostavili za deň. Ale ani nemali Claude.',
      'Dnes odpovieš na e-mail do 24 hodín. Alebo aspoň do 24 dní.',
      'Dýchaj. Deploy prebehol. Pravdepodobne.',
      'Tvoj startup je ako sourdough: potrebuje čas, trpezlivosť a občas smrdí.',
      'Každá zhoda v Robiqu je malý zázrak. Každá chyba tiež, len iný druh.',
      'Nie si podvodník. Podvodník by mal lepší pitch deck.',
      'Dnes je dobrý deň na to, aby si nič nerozbil/a. Zajtra tiež.',
      'Pamätaj: brigádnici ťa potrebujú. Firmy ťa potrebujú. Kaviareň v Trenčíne ťa potrebuje najviac.',
      'Investor sa ozve. Možno. Zatiaľ si daj obed.',
      'Si CEO. Chief Everything Officer. Aj upratovania.',
      'Tvoj kód je krásny. Nikto to nevidí, ale je.',
      'Dnes neotváraj Google Analytics. Máš vlastné. Sú lepšie.',
      'Trpezlivosť je cnosť. Rýchly internet je lepšia cnosť.',
      'Každý „nie“ od firmy je o krok bližšie k „áno“. Alebo k ďalšiemu „nie“. Štatistika je krutá.',
      'Vstal/a si. To je viac, než 40 % startupov.',
      'Verzia 1.0 nemusí byť dokonalá. Musí len existovať. Tvoja existuje. Gratulujeme.',
      'Keď to nejde, reštartuj. Notebook, kávovar, seba.',
      'Ideš dobre. Ak čítaš tento admin, ideš lepšie ako väčšina.',
      'Buď ako Supabase: väčšinu času funguj.',
      'Dnes si zaslúžiš pochvalu. Tu je: 👏. Viac nemáme, sme bootstrapped.',
      'Zhody dnes: nevieme dopredu. Ale bude ich viac ako včera. Alebo menej. Ale bude!',
      'Ak dnes nič nefunguje, je to cache. Vždy je to cache.',
      'Práca z domu je tiež práca. Práca z postele je diskutabilná.',
      'Nikto nevie, čo robí. Ty to aspoň loguješ.',
      'Tvoj najlepší inzerát ešte nebol napísaný. Tvoj najhorší už áno („otrok“, 19. 9.).',
      'Pripomienka: nezabudni na adresu prevádzkovateľa v zásadách. Aj právnici potrebujú vedieť, kde bývaš.',
      'Dnes ťa nič nezastaví. Okrem CORS.',
      'Milión používateľov začína jedným. A tým prvým si bol/a ty, keď si to testoval/a.',
    ];
    const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
    const affirmation = AFFIRMATIONS[dayOfYear % AFFIRMATIONS.length];
    // Malé hlášky navyše — náhodné pri každom načítaní (loading, prázdne stavy, pätička).
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const LOADING = ['Načítavam…', 'Počítam zhody na prstoch…', 'Pýtam sa databázy, ako sa má…', 'Lúštim čísla…', 'Chvíľku, dopíjam kávu…', 'Presviedčam Supabase, aby odpovedal…', 'Rátam brigádnikov, jeden po druhom…', 'Hľadám, kde som to položil/a…', 'Otváram Excel v hlave…', 'Sekundu, aj čísla si musia oddýchnuť…'];
    const NO_REPORTS = ['Nič nečaká. Internet je dnes slušný. 🎉', 'Žiadne nahlásenia. Buď je všetko v poriadku, alebo nikto nevie, kde je tlačidlo. 🤔', 'Prázdno. Užívaj si to, kým to trvá. ☕', 'Nula problémov. Zapíš si dátum. 📅', 'Nič. Ani jeden „otrok“. Pokrok! 🏆'];
    const NO_ROWS = ['Zatiaľ nič. Ale bude!', 'Prázdno ako pondelok ráno.', 'Tu ešte nikto nebol. Ty si prvý/á.', 'Nič nenašlo. Skús menej písmen, alebo viac kávy.'];
    const FOOTERS = [
      'Tento admin bol vyrobený s láskou, kávou a zhruba 40 volaniami na Supabase.',
      'Ak niečo nefunguje, je to feature. Ak to funguje, je to náhoda. Ak to funguje dvakrát, je to Robiq.',
      'Štatistika: 100 % adminov, ktorí toto čítajú, sú admini.',
      'Pripomienka: brigádnici sú ľudia, firmy sú tiež ľudia, databáza nie je človek (zatiaľ).',
      'Robiq — lebo scrollovať Facebook skupiny je práca, za ktorú nikto neplatí.',
      'Dnešný počet chýb v produkcii: neznámy. A to je dobré znamenie. Asi.',
      'Tip: keď sa čísla nehýbu, obnov stránku. Keď sa hýbu, neobnovuj, nech to nevidia.',
      'Tento riadok je tu, aby stránka nekončila tak náhle.',
      'Powered by Postgres, Cloudflare a slovenská tvrdohlavosť.',
      'Ak si to dočítal/a až sem, zaslúžiš si prestávku. Choď. Ja tu počkám.',
      '„Otrok“ (19. 9. 2026) — nikdy nezabudneme.',
      'Dnes je dobrý deň spočítať niečo. Napríklad zhody. Alebo kávy.',
    ];

    function render(d) {
      const ev = d.events || {}, p = d.period || {}, t = d.totals || {}, daily = d.daily || [];
      const maxV = Math.max(1, ...daily.map(x => x.visits + x.interests));
      $('dash').innerHTML = `
        <div class="card" style="background:linear-gradient(135deg,#40319F,#7C6CE0);color:#fff;border:none">
          <p class="sec" style="color:rgba(255,255,255,.7)">Denná afirmácia</p>
          <p style="margin:0;font-size:17px;font-weight:700;line-height:1.4">„${esc(affirmation)}“</p></div>
        <div class="card"><p class="sec">Za obdobie (${d.days} dní)</p>
          <div class="tiles">
            <div class="tile"><div class="n">${ev.visit || 0}</div><div class="l">otvorení appky</div></div>
            <div class="tile"><div class="n">${p.new_students || 0}</div><div class="l">nových brigádnikov</div></div>
            <div class="tile"><div class="n">${p.new_companies || 0}</div><div class="l">nových firiem</div></div>
            <div class="tile"><div class="n">${p.postings_new || 0}</div><div class="l">nových inzerátov</div></div>
            <div class="tile"><div class="n">${p.interests || 0}</div><div class="l">„Mám záujem“</div></div>
            <div class="tile"><div class="n">${p.skips || 0}</div><div class="l">preskočení</div></div>
            <div class="tile"><div class="n">${p.company_interests || 0}</div><div class="l">oslovení od firiem</div></div>
            <div class="tile"><div class="n">${p.matches || 0}</div><div class="l">zhôd</div></div>
            <div class="tile"><div class="n">${p.messages || 0}</div><div class="l">správ v chate</div></div>
            <div class="tile"><div class="n">${ev.detail_open || 0}</div><div class="l">otvorených detailov</div></div>
            <div class="tile"><div class="n">${ev.gate_shown || 0}</div><div class="l">„prihlás sa“ pri záujme</div></div>
            <div class="tile"><div class="n">${ev.login || 0}</div><div class="l">prihlásení e-mailom</div></div>
          </div></div>

        <div class="card"><p class="sec">Po dňoch — otvorenia appky (fialová) a „Mám záujem“ (zelená)</p>
          <div class="chart">${daily.map(x => `<div class="col" title="${fmtDay(x.day)}: ${x.visits} otvorení, ${x.interests} záujmov, ${x.new_users} nových účtov, ${x.matches} zhôd">
            ${x.visits + x.interests ? `<div class="tip">${x.visits}</div>` : ''}
            <div class="v" style="height:${x.visits / maxV * 100}%"></div><div class="v b" style="height:${x.interests / maxV * 100}%"></div>
            <div class="d">${fmtDay(x.day)}</div></div>`).join('')}</div>
          <div class="legend">Číslo nad stĺpcom = otvorenia. Podrž myš na stĺpci pre detail.</div></div>

        <div class="card"><p class="sec">Lievik registrácie</p>
          <div class="funnel">${funnel('Brigádnik', 'student', d.reg || {})}${funnel('Firma', 'firm', d.reg || {})}</div>
          <p class="muted" style="margin:14px 0 0">Zablokované: ${Object.entries(d.blocked || {}).map(([k, v]) => `${esc(k)} ×${v}`).join(', ') || 'nič'}
            &nbsp;·&nbsp; Klik na „Pokračovať s Google“: ${ev.login_google_click || 0}</p></div>

        <div class="card"><p class="sec">Celkovo</p>
          <div class="kv">
            <b>${t.students || 0}</b><span>brigádnikov</span>
            <b>${t.companies || 0}</b><span>firiem (${t.companies_verified || 0} overených podľa IČO)</span>
            <b>${t.postings_active || 0}</b><span>aktívnych inzerátov</span>
            <b>${t.matches || 0}</b><span>zhôd od začiatku</span>
          </div></div>
        <p class="muted">Štatistika je anonymná: ukladá sa len názov udalosti, rola a čas — bez ID používateľa, relácie či cookies.</p>`;
    }

    // ─── Firmy ───
    const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('sk-SK') : '–';
    let companies = [], postings = [], q = '';
    function renderCompanies() {
      const needle = q.toLowerCase();
      const rows = companies.filter(c => !needle || [c.name, c.ico, c.contact_name].join(' ').toLowerCase().includes(needle));
      $('dash').innerHTML = `<div class="card">
        <div class="tools"><input class="input" id="q" placeholder="Hľadať firmu, IČO, kontakt…" value="${esc(q)}">
          <span class="muted">${rows.length} z ${companies.length} firiem · ${companies.filter(c => c.verified).length} overených</span></div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Firma</th><th>IČO</th><th>Stav</th><th class="num">Inzeráty</th><th class="num">Záujmy</th><th class="num">Zhody</th><th>Registrácia</th><th></th></tr></thead>
        <tbody>${rows.map(c => `<tr>
          <td><b>${esc(c.name)}</b><div class="sub">${esc(c.contact_name || '')}${c.fields?.length ? ' · ' + esc(c.fields.join(', ')) : ''}</div></td>
          <td>${esc(c.ico || '–')}</td>
          <td>${c.verified ? '<span class="tag ok">✓ overená</span>' : '<span class="tag warn">neoverená</span>'}</td>
          <td class="num" data-l="Inzeráty">${c.postings_active}/${c.postings}${c.postings_blocked ? ` <span class="tag err">${c.postings_blocked} ⛔</span>` : ''}</td>
          <td class="num" data-l="Záujmy">${c.interests}</td><td class="num" data-l="Zhody">${c.matches}</td>
          <td class="sub">${fmtDate(c.created_at)}${c.last_posting_at ? '<br>posl. inzerát ' + fmtDate(c.last_posting_at) : ''}</td>
          <td><div class="act"><button class="mini ${c.verified ? 'danger' : ''}" data-verify="${c.id}" data-to="${!c.verified}">${c.verified ? 'Odobrať overenie' : 'Overiť ručne'}</button></div></td>
        </tr>`).join('') || '<tr><td colspan="8" class="muted">' + pick(NO_ROWS) + '</td></tr>'}</tbody></table></div>
        <p class="muted" style="margin:12px 0 0">Ručné overenie prepíše výsledok z Registra právnických osôb. Pri zmene IČO firmou sa overenie zruší a skontroluje znova.</p></div>`;
      $('q').addEventListener('input', e => { q = e.target.value; const pos = e.target.selectionStart; renderCompanies(); const el = $('q'); el.focus(); el.setSelectionRange(pos, pos); });
    }

    // ─── Inzeráty ───
    let onlyProblem = false;
    function renderPostings() {
      const needle = q.toLowerCase();
      const rows = postings.filter(p => (!needle || [p.title, p.company, p.description].join(' ').toLowerCase().includes(needle)) && (!onlyProblem || p.blocked || !p.verified));
      const stateTag = p => p.blocked ? `<span class="tag err">⛔ pozastavené Robiqom</span>` : !p.active ? '<span class="tag off">pozastavené firmou</span>' : '<span class="tag ok">aktívny</span>';
      $('dash').innerHTML = `<div class="card">
        <div class="tools"><input class="input" id="q" placeholder="Hľadať inzerát, firmu, text…" value="${esc(q)}">
          <label><input type="checkbox" id="onlyProblem" ${onlyProblem ? 'checked' : ''}> len pozastavené / neoverené firmy</label>
          <span class="muted">${rows.length} z ${postings.length}</span></div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Inzerát</th><th>Firma</th><th>Stav</th><th class="num">Zobr.</th><th class="num">Záujmy</th><th class="num">Zhody</th><th>Pridané</th><th></th></tr></thead>
        <tbody>${rows.map(p => `<tr>
          <td><b>${esc(p.title)}</b> <span class="sub">${esc(p.pay)} €/hod · ${p.need} ${p.need === 1 ? 'miesto' : 'miest'}${p.only18 ? ' · 18+' : ''}</span>
            ${p.types?.length ? `<div class="sub">${esc(p.types.join(', '))}</div>` : ''}
            ${p.description ? `<details><summary>popis</summary><p>${esc(p.description)}</p></details>` : ''}
            ${p.blocked && p.block_reason ? `<div class="sub" style="color:#DC2626">dôvod: ${esc(p.block_reason)}</div>` : ''}</td>
          <td>${esc(p.company)}<div class="sub">${p.verified ? '✓ overená' : '<span style="color:#B45309">neoverená</span>'}</div></td>
          <td>${stateTag(p)}</td>
          <td class="num" data-l="Zobrazenia">${p.views}</td><td class="num" data-l="Záujmy">${p.interests}</td><td class="num" data-l="Zhody">${p.matches}</td>
          <td class="sub">${fmtDate(p.created_at)}</td>
          <td><div class="act">${p.blocked
            ? `<button class="mini" data-unblock="${p.id}">Obnoviť</button>`
            : `<button class="mini danger" data-block="${p.id}">Pozastaviť</button>`}</div></td>
        </tr>`).join('') || '<tr><td colspan="8" class="muted">' + pick(NO_ROWS) + '</td></tr>'}</tbody></table></div>
        <p class="muted" style="margin:12px 0 0">Pozastavený inzerát zmizne z feedu; firma vidí značku s dôvodom a sama ho zapnúť nevie. Ľudia, ktorí už dali záujem, ho stále vidia vo svojich záujmoch.</p></div>`;
      $('q').addEventListener('input', e => { q = e.target.value; const pos = e.target.selectionStart; renderPostings(); const el = $('q'); el.focus(); el.setSelectionRange(pos, pos); });
      $('onlyProblem').addEventListener('change', e => { onlyProblem = e.target.checked; renderPostings(); });
    }

    // ─── Nahlásenia ───
    let reports = [];
    const REASONS = { scam: 'Podvod', inappropriate: 'Nevhodný obsah', duplicate: 'Duplicita / spam', other: 'Iné' };
    const TYPES = { posting: 'inzerát', company: 'firma', student: 'brigádnik' };
    function renderReports() {
      const open = reports.filter(r => r.status === 'open'), done = reports.filter(r => r.status !== 'open');
      const row = r => `<tr>
        <td class="sub">${fmtDate(r.created_at)}<br>${r.reporter_role ? (r.reporter_role === 'student' ? 'brigádnik' : 'firma') : 'hosť'}</td>
        <td><span class="tag off">${TYPES[r.target_type] || r.target_type}</span><br><b>${esc(r.target_label || '(zmazané)')}</b>
          ${r.target_blocked ? '<br><span class="tag err">⛔ pozastavené</span>' : ''}</td>
        <td><b>${REASONS[r.reason] || r.reason}</b>${r.note ? `<div class="sub" style="white-space:pre-wrap">${esc(r.note)}</div>` : ''}
          ${r.admin_note ? `<div class="sub" style="color:#40319F">admin: ${esc(r.admin_note)}</div>` : ''}</td>
        <td><div class="act">
          ${r.status === 'open' ? `
            ${r.target_type === 'posting' && !r.target_blocked ? `<button class="mini danger" data-block="${esc(r.target_id)}" data-report="${r.id}">Pozastaviť inzerát</button>` : ''}
            <button class="mini" data-resolve="${r.id}" data-status="resolved">Vyriešené</button>
            <button class="mini" data-resolve="${r.id}" data-status="dismissed">Zamietnuť</button>`
          : `<span class="tag ${r.status === 'resolved' ? 'ok' : 'off'}">${r.status === 'resolved' ? 'vyriešené' : 'zamietnuté'}</span>
             <button class="mini" data-resolve="${r.id}" data-status="open">Otvoriť znova</button>`}
        </div></td></tr>`;
      const table = list => `<div class="tblwrap"><table class="tbl"><thead><tr><th>Kedy · kto</th><th>Čo</th><th>Dôvod</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
      $('dash').innerHTML = `
        <div class="card"><p class="sec">Otvorené (${open.length})</p>${open.length ? table(open) : '<p class="muted">' + pick(NO_REPORTS) + '</p>'}</div>
        ${done.length ? `<div class="card"><p class="sec">Vybavené (${done.length})</p>${table(done)}</div>` : ''}
        <p class="muted">Nahlásiť môže ktokoľvek (aj bez účtu) z detailu inzerátu alebo z chatu. Lehota na vybavenie nie je zákonom daná, ale DSA očakáva „bez zbytočného odkladu“ — ideálne do pár dní.</p>`;
    }
    async function loadReports() { const { data, error } = await sb.rpc('admin_reports'); if (error) throw error; reports = data || []; updateBadge(); }
    function updateBadge() { const n = reports.filter(r => r.status === 'open').length; $('rep-badge').textContent = n ? ` ${n}` : ''; $('rep-badge').style.color = n ? '#FCA5A5' : ''; }
    async function refreshBadge() { const { data } = await sb.rpc('admin_open_reports_count'); if (typeof data === 'number') { $('rep-badge').textContent = data ? ` ${data}` : ''; $('rep-badge').style.color = data ? '#FCA5A5' : ''; } }

    // Admin actions (buttons in the tables) — each DB function checks is_admin() itself.
    $('dash').addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      try {
        if (b.dataset.verify) {
          const { error } = await sb.rpc('admin_set_company_verified', { p_id: b.dataset.verify, p_verified: b.dataset.to === 'true' });
          if (error) throw error; await loadCompanies(); renderCompanies();
        }
        if (b.dataset.block) {
          const reason = prompt('Dôvod pozastavenia (uvidí ho firma):', 'Inzerát nespĺňa pravidlá Robiq');
          if (reason === null) return;
          const { error } = await sb.rpc('admin_set_posting_blocked', { p_id: +b.dataset.block, p_blocked: true, p_reason: reason.trim() });
          if (error) throw error;
          if (b.dataset.report) {                            // from the reports tab: also close the report
            await sb.rpc('admin_resolve_report', { p_id: +b.dataset.report, p_status: 'resolved', p_note: 'Inzerát pozastavený: ' + reason.trim() });
            await loadReports(); renderReports();
          } else { await loadPostings(); renderPostings(); }
        }
        if (b.dataset.resolve) {
          const status = b.dataset.status;
          const note = status === 'open' ? '' : (prompt('Poznámka (nepovinné):', '') ?? null);
          if (note === null && status !== 'open') return;
          const { error } = await sb.rpc('admin_resolve_report', { p_id: +b.dataset.resolve, p_status: status, p_note: note || '' });
          if (error) throw error; await loadReports(); renderReports();
        }
        if (b.dataset.unblock) {
          const { error } = await sb.rpc('admin_set_posting_blocked', { p_id: +b.dataset.unblock, p_blocked: false });
          if (error) throw error; await loadPostings(); renderPostings();
        }
      } catch (err) { alert(err.message); }
    });
    async function loadCompanies() { const { data, error } = await sb.rpc('admin_companies'); if (error) throw error; companies = data || []; }
    async function loadPostings()  { const { data, error } = await sb.rpc('admin_postings');  if (error) throw error; postings  = data || []; }

    // ─── tabs ───
    let tab = 'stats';
    async function load() {
      $('dash').innerHTML = '<p class="muted">' + pick(LOADING) + '</p>';
      $('seg').style.visibility = tab === 'stats' ? 'visible' : 'hidden';
      try {
        if (tab === 'stats') {
          const { data, error } = await sb.rpc('analytics_summary', { p_days: days }); if (error) throw error; render(data);
        } else if (tab === 'companies') { await loadCompanies(); renderCompanies(); }
        else if (tab === 'reports') { await loadReports(); renderReports(); }
        else { await loadPostings(); renderPostings(); }
        if (tab !== 'reports') refreshBadge();
      } catch (error) {
        $('dash').innerHTML = `<div class="card"><div class="err">${esc(error.message)}</div><p class="muted">Tento účet nie je v zozname adminov (tabuľka <code>admins</code>), alebo ešte nebola spustená migrácia.</p></div>`;
      }
    }
    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      tab = b.dataset.tab; q = ''; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); load();
    });
    async function show() {
      const { data: { session } } = await sb.auth.getSession();
      $('login').hidden = !!session; $('controls').hidden = !session; $('tabs').hidden = !session; $('dash').hidden = !session; $('foot').hidden = !session;
      if (session) { $('foot').textContent = pick(FOOTERS); load(); }
    }
    $('form').addEventListener('submit', async e => {
      e.preventDefault(); $('login-err').textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
      if (error) { $('login-err').textContent = error.message === 'Invalid login credentials' ? 'Nesprávny e-mail alebo heslo.' : error.message; return; }
      $('pass').value = ''; show();
    });
    $('google').addEventListener('click', async () => {      // same Google sign-in as the app; comes back to this page
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (error) $('login-err').textContent = error.message;
    });
    $('logout').addEventListener('click', async () => { await sb.auth.signOut(); show(); });
    if (location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);
    $('seg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      days = +b.dataset.days; [...$('seg').children].forEach(x => x.classList.toggle('on', x === b)); load();
    });
    show();
  </script>
</body>
</html>
