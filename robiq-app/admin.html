<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robiq — štatistika</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi">
  <style>
    /* Admin dashboard: reads analytics_summary() (schema.sql). Only e-mails in table `admins` get data. */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Satoshi', system-ui, sans-serif; background: #EEEBF7; color: #17122E; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font-size: 22px; margin: 0; } h1 b { color: #40319F; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .seg { display: inline-flex; background: rgba(36,27,69,.07); border-radius: 10px; padding: 3px; }
    .seg button { border: none; background: transparent; color: #6E688C; font: inherit; font-weight: 700; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: #40319F; color: #fff; }
    .card { background: #fff; border: 1px solid #DEDBEC; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
    .sec { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6E688C; font-weight: 700; margin: 0 0 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: rgba(85,70,196,.06); border-radius: 12px; padding: 12px 14px; }
    .tile .n { font-size: 26px; font-weight: 700; color: #40319F; line-height: 1.1; }
    .tile .l { font-size: 12px; color: #6E688C; margin-top: 4px; }
    .funnel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .funnel .row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
    .funnel .row .lbl { width: 130px; color: #6E688C; }
    .funnel .row .bar { flex: 1; height: 14px; background: rgba(36,27,69,.07); border-radius: 7px; overflow: hidden; }
    .funnel .row .bar i { display: block; height: 100%; background: #40319F; border-radius: 7px; }
    .funnel .row .val { width: 60px; text-align: right; font-weight: 700; }
    .funnel h3 { margin: 0 0 6px; font-size: 14px; }
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 16px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; position: relative; min-width: 0; }
    .chart .col .v { background: #40319F; border-radius: 4px 4px 0 0; min-height: 2px; }
    .chart .col .v.b { background: #15803D; opacity: .8; margin-top: 2px; border-radius: 0; }
    .chart .col .d { font-size: 10px; color: #6E688C; text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; }
    .chart .col .tip { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; color: #40319F; }
    .legend { font-size: 12px; color: #6E688C; margin-top: 8px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin: 0 4px 0 10px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; } .kv b { color: #40319F; }
    .login { max-width: 360px; margin: 60px auto; }
    .input { width: 100%; border: 1px solid #DEDBEC; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 14px; margin-bottom: 10px; }
    .btn { width: 100%; border: none; background: #40319F; color: #fff; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn.ghost { background: transparent; color: #6E688C; width: auto; padding: 6px 10px; font-size: 12.5px; }
    .err { color: #DC2626; font-size: 12.5px; font-weight: 700; min-height: 16px; margin: 4px 0 8px; }
    .muted { color: #6E688C; font-size: 12.5px; }
    @media (max-width: 640px) { .funnel { grid-template-columns: 1fr; } .chart .col:nth-child(even) .d { visibility: hidden; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Robiq<b>.</b> štatistika</h1>
      <div id="controls" hidden>
        <span class="seg" id="seg"><button data-days="7" class="on">7 dní</button><button data-days="30">30 dní</button><button data-days="90">90 dní</button></span>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← Späť do appky</a>
        <button class="btn ghost" id="logout">Odhlásiť</button>
      </div>
    </div>

    <div class="card login" id="login">
      <p class="muted" style="margin-top:0">Prihlás sa účtom, ktorý je v zozname adminov.</p>
      <form id="form">
        <input class="input" type="email" id="email" placeholder="E-mail" autocomplete="email">
        <input class="input" type="password" id="pass" placeholder="Heslo" autocomplete="current-password">
        <div class="err" id="login-err"></div>
        <button class="btn" type="submit">Prihlásiť sa</button>
      </form>
      <p class="muted" style="text-align:center;margin:12px 0">alebo</p>
      <button class="btn" id="google" type="button" style="background:#fff;color:#17122E;border:1px solid #DEDBEC">Pokračovať s Google</button>
    </div>

    <div id="dash" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(ROBIQ_CONFIG.supabaseUrl, ROBIQ_CONFIG.supabaseAnonKey);
    let days = 7;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fmtDay = iso => { const d = new Date(iso); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
    const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';

    // Registration funnel: started → step 2 → step 3 → done, per role (d.reg = { "reg_start:student": n, "reg_step:student:2": n, … }).
    function funnel(title, role, reg) {
      const g = k => reg[k] || 0;
      const steps = [['Začali registráciu', g('reg_start:' + role)], ['Krok 2', g('reg_step:' + role + ':2')],
                     ['Krok 3', g('reg_step:' + role + ':3')], ['Dokončili', g('reg_done:' + role)]];
      const max = Math.max(1, ...steps.map(s => s[1]));
      return `<div><h3>${title}</h3>${steps.map(([l, v], i) => `<div class="row"><span class="lbl">${l}</span><span class="bar"><i style="width:${v / max * 100}%"></i></span><span class="val">${v}${i ? ' <span class="muted">' + pct(v, steps[0][1]) + '</span>' : ''}</span></div>`).join('')}</div>`;
    }

    function render(d) {
      const ev = d.events || {}, p = d.period || {}, t = d.totals || {}, daily = d.daily || [];
      const maxV = Math.max(1, ...daily.map(x => x.visits + x.interests));
      $('dash').innerHTML = `
        <div class="card"><p class="sec">Za obdobie (${d.days} dní)</p>
          <div class="tiles">
            <div class="tile"><div class="n">${ev.visit || 0}</div><div class="l">otvorení appky</div></div>
            <div class="tile"><div class="n">${p.new_students || 0}</div><div class="l">nových brigádnikov</div></div>
            <div class="tile"><div class="n">${p.new_companies || 0}</div><div class="l">nových firiem</div></div>
            <div class="tile"><div class="n">${p.postings_new || 0}</div><div class="l">nových inzerátov</div></div>
            <div class="tile"><div class="n">${p.interests || 0}</div><div class="l">„Mám záujem“</div></div>
            <div class="tile"><div class="n">${p.skips || 0}</div><div class="l">preskočení</div></div>
            <div class="tile"><div class="n">${p.company_interests || 0}</div><div class="l">oslovení od firiem</div></div>
            <div class="tile"><div class="n">${p.matches || 0}</div><div class="l">zhôd</div></div>
            <div class="tile"><div class="n">${p.messages || 0}</div><div class="l">správ v chate</div></div>
            <div class="tile"><div class="n">${ev.detail_open || 0}</div><div class="l">otvorených detailov</div></div>
            <div class="tile"><div class="n">${ev.gate_shown || 0}</div><div class="l">„prihlás sa“ pri záujme</div></div>
            <div class="tile"><div class="n">${ev.login || 0}</div><div class="l">prihlásení e-mailom</div></div>
          </div></div>

        <div class="card"><p class="sec">Po dňoch — otvorenia appky (fialová) a „Mám záujem“ (zelená)</p>
          <div class="chart">${daily.map(x => `<div class="col" title="${fmtDay(x.day)}: ${x.visits} otvorení, ${x.interests} záujmov, ${x.new_users} nových účtov, ${x.matches} zhôd">
            ${x.visits + x.interests ? `<div class="tip">${x.visits}</div>` : ''}
            <div class="v" style="height:${x.visits / maxV * 100}%"></div><div class="v b" style="height:${x.interests / maxV * 100}%"></div>
            <div class="d">${fmtDay(x.day)}</div></div>`).join('')}</div>
          <div class="legend">Číslo nad stĺpcom = otvorenia. Podrž myš na stĺpci pre detail.</div></div>

        <div class="card"><p class="sec">Lievik registrácie</p>
          <div class="funnel">${funnel('Brigádnik', 'student', d.reg || {})}${funnel('Firma', 'firm', d.reg || {})}</div>
          <p class="muted" style="margin:14px 0 0">Zablokované: ${Object.entries(d.blocked || {}).map(([k, v]) => `${esc(k)} ×${v}`).join(', ') || 'nič'}
            &nbsp;·&nbsp; Klik na „Pokračovať s Google“: ${ev.login_google_click || 0}</p></div>

        <div class="card"><p class="sec">Celkovo</p>
          <div class="kv">
            <b>${t.students || 0}</b><span>brigádnikov</span>
            <b>${t.companies || 0}</b><span>firiem (${t.companies_verified || 0} overených podľa IČO)</span>
            <b>${t.postings_active || 0}</b><span>aktívnych inzerátov</span>
            <b>${t.matches || 0}</b><span>zhôd od začiatku</span>
          </div></div>
        <p class="muted">Štatistika je anonymná: ukladá sa len názov udalosti, rola a čas — bez ID používateľa, relácie či cookies.</p>`;
    }

    async function load() {
      $('dash').innerHTML = '<p class="muted">Načítavam…</p>';
      const { data, error } = await sb.rpc('analytics_summary', { p_days: days });
      if (error) { $('dash').innerHTML = `<div class="card"><div class="err">${esc(error.message)}</div><p class="muted">Tento účet nie je v zozname adminov (tabuľka <code>admins</code>).</p></div>`; return; }
      render(data);
    }
    async function show() {
      const { data: { session } } = await sb.auth.getSession();
      $('login').hidden = !!session; $('controls').hidden = !session; $('dash').hidden = !session;
      if (session) load();
    }
    $('form').addEventListener('submit', async e => {
      e.preventDefault(); $('login-err').textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
      if (error) { $('login-err').textContent = error.message === 'Invalid login credentials' ? 'Nesprávny e-mail alebo heslo.' : error.message; return; }
      $('pass').value = ''; show();
    });
    $('google').addEventListener('click', async () => {      // same Google sign-in as the app; comes back to this page
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (error) $('login-err').textContent = error.message;
    });
    $('logout').addEventListener('click', async () => { await sb.auth.signOut(); show(); });
    if (location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);
    $('seg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      days = +b.dataset.days; [...$('seg').children].forEach(x => x.classList.toggle('on', x === b)); load();
    });
    show();
  </script>
</body>
</html>
