        </g>
        <g stroke="url(#aart2)">
          <path d="M-80,905 C260,790 530,845 720,700 C955,520 880,340 1100,215 C1280,113 1395,105 1560,45" stroke-width="1.8" opacity=".5"/>

      </g>
    </svg>

    <div class="a-content" id="a-content">
      <header class="a-hdr" id="a-hdr">
        <span class="glow"></span>
        <span class="a-logo">Robiq<b>.</b></span>
        <div class="a-hdr-right" id="a-hdr-right"></div>
      </header>

      <div id="a-main"></div>

      <footer class="a-footer">
        <span class="brand">Robiq<b>.</b> <span>© 2026</span></span>
        <nav><a href="ochrana-osobnych-udajov.html" target="_blank" rel="noopener">Ochrana osobných údajov</a><a href="#">Obchodné podmienky</a></nav>
        <div class="a-contact">
          <div class="h">Kontakt</div>
          <a class="mail" href="mailto:ceo@robiq.sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>ceo@robiq.sk</a>

    <div id="a-dock"></div>
    <div id="a-layers"></div>

  <!-- ═══ LOGIN — l.59–94 ═══ -->
  <section class="screen" id="scr-login" hidden>
    <div class="panel" aria-hidden="true">
      <div class="ring l"></div><div class="ring r"></div>
      <div class="sphere l"><div><canvas data-dot="L" width="900" height="900"></canvas></div></div>
      <div class="sphere r"><div><canvas data-dot="R" width="900" height="900"></canvas></div></div>
      <div class="seam"></div>
    </div>
    <main class="login-card">
      <button class="back back-top" data-go="back">← Späť</button>
      <div class="logo"><span>Robiq<b>.</b></span></div>
      <div class="tagline">Nehľadaj brigádu. Nechaj ju nájsť teba.</div>
      <form class="fields" id="login-form">
        <input class="input" type="email" id="login-email" placeholder="E-mail" autocomplete="email">
        <input class="input" type="password" id="login-pass" placeholder="Heslo" autocomplete="current-password">
      </form>
      <div class="form-err" id="login-err"></div>
      <button class="primary" data-go="doLogin" id="login-btn">Prihlásiť sa</button>
      <div class="divider"><span></span>alebo<span></span></div>
      <button class="secondary" data-go="goRegister">Vytvoriť účet</button>
      <div class="link-row"><button class="link" data-go="goFirmReg">Ste firma? Vytvorte si firemný účet →</button></div>
    </main>
  </section>

  <!-- ═══ PICK — l.199–228 ═══ -->
  <section class="screen" id="scr-pick" hidden>
    <main class="card">
      <button class="back back-top" data-go="back">← Späť</button>
      <div class="logo"><span>Robiq<b>.</b></span></div>
      <div class="tagline">Aký účet si vytvárate?</div>
      <div class="choices">
        <button class="choice" data-go="pickStudent"><span class="icon">◇</span><span class="txt"><b>Hľadám prácu</b><span>3 kroky, bez CV. Ponuky ťa nájdu samy.</span></span></button>
        <button class="choice" data-go="pickFirm"><span class="icon">◈</span><span class="txt"><b>Ponúkam prácu — firma</b><span>Firemný profil, inzeráty a AI výber kandidátov.</span></span></button>
      </div>
      <div class="link-row"><button class="link" data-go="goLogin">Už mám účet — prihlásiť sa</button></div>
    </main>
  </section>

  <!-- ═══ OB — l.97–194 ═══ -->
  <section class="screen" id="scr-ob" hidden>
    <main class="card w540">
      <div class="head">
        <div class="eyebrow">Krok <span id="ob-no">1</span> / 3</div>
        <div class="dots" id="ob-dots"><span></span><span></span><span></span></div>
      </div>
      <div id="ob-step"></div>
      <div class="form-err" id="ob-err"></div>
      <div class="foot"><button class="back" id="ob-back">← Späť</button><button class="next" id="ob-next">Pokračovať</button></div>
    </main>
  </section>

  <!-- ═══ FOB — l.230–291 ═══ -->
  <section class="screen" id="scr-fob" hidden>
    <main class="card">
      <div class="head">
        <div class="eyebrow">Firemný účet · krok <span id="fob-no">1</span> / 3</div>
        <div class="dots" id="fob-dots"><span></span><span></span><span></span></div>
      </div>
      <div id="fob-step"></div>
      <div class="form-err" id="fob-err"></div>
      <div class="foot"><button class="back" id="fob-back">← Späť</button><button class="next" id="fob-next">Pokračovať</button></div>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
