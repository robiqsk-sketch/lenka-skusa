<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robiq</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-sauce-one">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi">

  <style>
    /* Every value below is copied from Robiq MVP.dc.html. Comments name the source line.
       Screens:  app = shell + feed (l.293–1021) · login (l.59–94) · pick (l.199–228)
                 ob = student onboarding (l.97–194) · fob = company registration (l.230–291) */

    * { box-sizing: border-box; }
    body {
      margin: 0; color: #000000; background: #F7F6FB;
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 500; -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(85,70,196,.45); }
    button, input { font-family: inherit; }
    input:focus { outline: none; border-color: #40319F !important; }      /* l.39 */
    input::placeholder { color: #3F3A55; }                                 /* l.40 */
    [hidden] { display: none !important; }

    /* Animations — l.17–38 */
    @keyframes waveDrift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-16px,12px); } }
    @keyframes floatLC  { 0%,100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-52%) translateX(22px); } }
    @keyframes floatRC  { 0%,100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-48%) translateX(-22px); } }
    @keyframes seam     { 0%,100% { opacity: .72; transform: translate(-50%,-50%) scaleY(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scaleY(1.14); } }
    @keyframes skShine  { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @keyframes bannerIn { from { transform: translate(-50%,-140%); opacity: 0; } to { transform: translate(-50%,0); opacity: 1; } }

    .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F6FB; }

    /* ═══════════ Shared card + header + footer (ob / fob / pick) ═══════════ */
    .card {
      width: 560px; max-width: 100%;
      background: #FFFFFF; border: 1px solid #CEC6E4;
      box-shadow: 0 12px 34px -12px rgba(48,36,110,.24);
      border-radius: 24px; padding: 38px 42px 34px; color: #000000;
    }
    .card.w540 { width: 540px; }
    @media (max-width: 640px) { .card { padding: 28px 22px 26px; } }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #40319F; }
    .dots { display: flex; gap: 7px; }
    .dots span { width: 26px; height: 4px; border-radius: 99px; transition: background .2s; background: rgba(36,27,69,.12); }
    .dots span.on { background: #40319F; }
    h2 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
    h2 b { font-weight: 700; color: #40319F; }
    .desc { color: #3F3A55; font-size: 13.5px; margin: 0; }
    .label { font-size: 13px; font-weight: 700; color: #000000; margin-bottom: 9px; }
    .input {
      background: rgba(36,27,69,.05); border: 1px solid #DEDBEC; border-radius: 12px;
      padding: 13px 16px; font-size: 14px; color: #000000; width: 100%;
    }
    .foot { display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: #3F3A55; font-size: 13px; cursor: pointer; padding: 10px 4px; }
    .back:hover { color: #000000; }
    .next {
      background: #40319F; color: #fff; border: none; border-radius: 12px; padding: 13px 30px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .2s;
    }
    .next:hover { background: #5546C4; }
    .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .logo span { font-family: 'Open Sauce One', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: .01em; color: #000000; }
    .logo b { font-weight: 700; color: #5546C4; }
    .tagline { text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #40319F; margin-bottom: 28px; }
    .link { background: none; border: none; font-size: 12.5px; color: #40319F; font-weight: 700; cursor: pointer; padding: 4px; }
    .link:hover { color: #5546C4; }
    .link-row { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(36,27,69,.08); text-align: center; }

    /* ═══════════ APP SHELL — l.295–373, 916–925 ═══════════ */
    #scr-app { height: 100vh; max-height: 100vh; display: flex; flex-direction: column; background: #F7F6FB; overflow: hidden; align-items: stretch; justify-content: flex-start; min-height: 0; }
    .a-art { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .a-art g.drift { animation: waveDrift 22s ease-in-out infinite; transform-origin: 720px 450px; }
    .a-content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 32px 130px; position: relative; z-index: 1; }

    .a-hdr {
      position: sticky; top: 0; z-index: 30; flex-shrink: 0; width: 100%; max-width: 1040px; margin: 0 auto 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
      background: #241D45; border: 1px solid rgba(159,143,242,.28); border-radius: 22px;
      filter: drop-shadow(0 8px 16px rgba(23,18,46,.18));
      transition: transform .28s ease;                          /* README: hides on scroll down, returns on scroll up */
    }
    .a-hdr.hide { transform: translateY(-130%); }
    .a-hdr .glow {
      position: absolute; left: 26px; right: 26px; bottom: 0; height: 2px; border-radius: 99px; pointer-events: none; opacity: .85;
      background: linear-gradient(90deg, rgba(124,108,224,0), #7C6CE0 30%, #CBC0FF 50%, #7C6CE0 70%, rgba(124,108,224,0));
    }
    .a-logo { font-family: 'Open Sauce One', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: .01em; color: #FFFFFF; }
    .a-logo b { font-weight: 700; color: #CBC0FF; }
    .a-hdr-right { display: flex; align-items: center; gap: 18px; }
    .a-guest { display: flex; align-items: center; gap: 9px; }
    .a-pill-ghost {
      background: transparent; color: #CBC0FF; border: 1px solid rgba(159,143,242,.42); border-radius: 99px;
      padding: 7px 15px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .2s, color .2s;
    }
    .a-pill-ghost:hover { background: rgba(159,143,242,.14); color: #FFFFFF; }
    .a-pill {
      background: #40319F; color: #fff; border: 1px solid rgba(159,143,242,.4); border-radius: 99px;
      padding: 7px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .a-pill:hover { background: #5546C4; }
    .a-pill.nova { font-size: 12px; }
    .a-acc { position: relative; }
    .a-ava {
      width: 32px; height: 32px; border: none; padding: 0; border-radius: 50%;
      background: linear-gradient(135deg, #5546C4, #9F8FF2); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 0 0 0 rgba(203,192,255,0); transition: box-shadow .2s;
    }
    .a-ava:hover { box-shadow: 0 0 0 3px rgba(203,192,255,.28); }
    .a-menu {
      position: absolute; top: 44px; right: 0; z-index: 60; width: 216px; background: #FFFFFF; border: 1px solid #CEC6E4;
      border-radius: 16px; box-shadow: 0 20px 44px -14px rgba(23,18,46,.38); padding: 7px; display: flex; flex-direction: column; gap: 1px; color: #000000;
    }
    .a-menu .name { padding: 11px 13px 9px; font-size: 13.5px; font-weight: 700; line-height: 1.2; }
    .a-menu hr { height: 1px; background: #EDEAF6; margin: 4px 6px 5px; border: none; }
    .a-menu button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none;
      border-radius: 10px; padding: 10px 13px; font-size: 13.5px; font-weight: 500; color: #17122E; cursor: pointer;
    }
    .a-menu button:hover { background: rgba(64,49,159,.07); }
    .a-menu button .ic { font-size: 14px; width: 16px; display: inline-block; }
    .a-menu button.notif { justify-content: space-between; }
    .a-menu button.notif .st { font-size: 11px; font-weight: 700; }
    .a-menu button.out { font-weight: 700; color: #DC2626; }
    .a-menu button.out:hover { background: rgba(220,38,38,.08); }

    .a-footer {
      max-width: 1040px; margin: 70px auto 0; padding: 22px 4px 0; border-top: 1px solid rgba(36,27,69,.12);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #6E688C;
    }
    .a-footer .brand { font-family: 'Open Sauce One', sans-serif; font-weight: 700; color: #17122E; }
    .a-footer .brand b { color: #5546C4; }
    .a-footer .brand span { font-family: 'Satoshi', sans-serif; font-weight: 400; color: #6E688C; }
    .a-footer nav { display: flex; gap: 22px; flex-wrap: wrap; }
    .a-footer a { color: #6E688C; text-decoration: none; }
    .a-footer a:hover { color: #40319F; }

    /* ═══════════ SKELETON — l.377–403 ═══════════ */
    .sk { background: linear-gradient(90deg, #DCD7EC 25%, #EAE6F5 37%, #DCD7EC 63%); background-size: 400% 100%; animation: skShine 1.25s ease-in-out infinite; }
    .sk.lt { background: linear-gradient(90deg, #E3DFF0 25%, #EFECF8 37%, #E3DFF0 63%); background-size: 400% 100%; }
    .sk.xl { background: linear-gradient(90deg, #E9E5F4 25%, #F3F1FA 37%, #E9E5F4 63%); background-size: 400% 100%; }
    .a-wrap { max-width: 1040px; margin: 0 auto; padding-top: 36px; }
    .sk-card { background: #FFFFFF; border: 1px solid #E4E0F0; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    /* ═══════════ OBJAVUJ — l.408–475 ═══════════ */
    .a-title { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
    .a-title h2 { font-size: 24px; margin: 0; color: #000000; }
    .a-title h2 b { color: #000000; }
    .a-title .sorted { font-size: 12px; color: #15803D; }

    .ai-tip {
      background: linear-gradient(160deg, #F0FBF3, #E7F6EC); border: 1px solid rgba(21,128,61,.25); border-radius: 18px;
      padding: 16px 22px; color: #000000; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .ai-tip .eb { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #15803D; font-weight: 700; }
    .ai-tip .mid { display: flex; gap: 11px; align-items: center; flex: 1; min-width: 240px; }
    .ai-tip .lg { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
    .ai-tip .t { font-size: 14px; font-weight: 700; }
    .ai-tip .f { font-size: 11.5px; color: #3F3A55; }
    .ai-tip .f b { color: #40319F; font-weight: 700; }
    .ai-tip button { background: rgba(21,128,61,.1); color: #15803D; border: 1px solid rgba(21,128,61,.25); border-radius: 10px; padding: 9px 18px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .ai-tip button:hover { background: rgba(21,128,61,.18); }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 960px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
    .job {
      zoom: .874; background: #FFFFFF; border: 1px solid #CEC6E4; box-shadow: 0 12px 34px -12px rgba(48,36,110,.24);
      border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 18px; color: #000000;
      transition: border-color .2s, box-shadow .2s;
    }
    .job:hover { border-color: rgba(124,108,224,.5); box-shadow: 0 16px 40px -20px rgba(91,33,182,.25); }
    .job .top { display: flex; align-items: flex-start; gap: 8px; }
    .job .posted { font-size: 11.5px; font-weight: 500; color: #3F3A55; }
    .job .more { margin-left: auto; position: relative; }
    .dots-btn {
      width: 28px; height: 28px; border: none; border-radius: 9px; background: transparent; color: #6E688C; font-size: 15px; line-height: 1;
      cursor: pointer; transition: background .15s, color .15s; margin: -4px -4px 0 0;
    }
    .dots-btn:hover { background: rgba(36,27,69,.07); color: #17122E; }
    .row-menu {
      position: absolute; right: 0; top: 32px; z-index: 20; width: 196px; background: #FFFFFF; border: 1px solid #CEC6E4; border-radius: 13px;
      padding: 6px; box-shadow: 0 16px 36px -10px rgba(48,36,110,.32); display: flex; flex-direction: column;
    }
    .row-menu button { text-align: left; background: none; border: none; border-radius: 9px; padding: 10px 12px; font-size: 13px; font-weight: 500; color: #17122E; cursor: pointer; transition: background .15s; }
    .row-menu button:hover { background: rgba(36,27,69,.06); }
    .row-menu button.danger { color: #B4232A; }
    .row-menu button.danger:hover { background: rgba(180,35,42,.08); }
    .job .who { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin-top: -8px; }
    .job .lg { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; color: #fff; flex-shrink: 0; }
    .job .t { font-size: 17.5px; font-weight: 700; line-height: 1.25; }
    .job .f { font-size: 14px; font-weight: 500; color: #000000; margin-top: 2px; }
    .job .rat { font-size: 12px; color: #000000; margin-top: 3px; }
    .job .pay { font-size: 22px; font-weight: 700; color: #000000; white-space: nowrap; }
    .job .pay small { font-size: 12px; color: #3F3A55; font-weight: 400; }
    .job .need { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #3F3A55; }
    .job .need span:first-child { white-space: nowrap; }
    .job .bar { flex: 1; height: 4px; border-radius: 99px; background: rgba(36,27,69,.08); overflow: hidden; display: block; }
    .job .bar i { display: block; height: 100%; border-radius: 99px; background-color: #0F0F13; }
    .job .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .job .tags span { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 99px; background: rgba(36,27,69,.06); color: #3F3A55; }
    .job .start { font-size: 13px; color: #3F3A55; margin-top: auto; }
    .job .start b { font-weight: 700; color: #000000; }
    .job .act { display: flex; gap: 8px; }
    .job .like { flex: 1; background: #40319F; color: #fff; border: none; border-radius: 11px; padding: 11px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
    .job .like:hover { background: #5546C4; }
    .job .skip { background: rgba(220,38,38,.08); color: #DC2626; border: none; border-radius: 11px; padding: 11px 17px; font-size: 17px; cursor: pointer; }
    .job .skip:hover { background: rgba(220,38,38,.16); }
    .job .sent { border: 1px solid rgba(21,128,61,.3); color: #15803D; border-radius: 11px; padding: 11px 0; font-size: 13px; font-weight: 700; text-align: center; background: rgba(21,128,61,.08); }

    .deck-empty { border-radius: 20px; border: 1px dashed #DEDBEC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 60px 30px; }
    .deck-empty .h { font-size: 20px; font-weight: 700; color: #000000; }
    .deck-empty .h b { font-weight: 700; color: #40319F; }
    .deck-empty p { font-size: 13px; color: #3F3A55; margin: 0; max-width: 32ch; }
    .deck-empty button { background: transparent; color: #3F3A55; border: 1px solid #DEDBEC; border-radius: 12px; padding: 10px 22px; font-size: 13px; cursor: pointer; }
    .deck-empty button:hover { color: #000000; border-color: #40319F; }

    /* ═══════════ PROFIL — l.515–635 ═══════════ */
    .prof { max-width: 640px; margin: 0 auto; padding-top: 44px; display: flex; flex-direction: column; gap: 16px; }
    .pcard { background: #FFFFFF; border: 1px solid #CEC6E4; box-shadow: 0 12px 34px -12px rgba(48,36,110,.24); border-radius: 22px; padding: 34px 36px; color: #000000; }
    .pcard.sm { padding: 26px 30px; }
    .p-head { display: flex; gap: 20px; align-items: center; margin-bottom: 26px; }
    .p-ava { width: 76px; height: 76px; border-radius: 50%; background: linear-gradient(135deg, #5546C4, #9F8FF2); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .p-name { font-size: 22px; font-weight: 700; }
    .p-sub { font-size: 13px; color: #3F3A55; }
    .p-edit { background: transparent; border: 1px solid #DEDBEC; border-radius: 11px; padding: 9px 18px; font-size: 12.5px; font-weight: 700; color: #3F3A55; cursor: pointer; flex-shrink: 0; }
    .p-edit:hover { color: #40319F; border-color: #40319F; }
    .p-sec { font-size: 15px; font-weight: 700; color: #000000; margin-bottom: 12px; }
    .p-sec.tight { margin-bottom: 8px; }
    .p-bio { font-size: 13.5px; line-height: 1.6; color: #3F3A55; margin: 0 0 24px; }
    .p-skills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
    .p-skill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 99px; background: rgba(124,108,224,.18); color: #17122E; }
    .p-skill b { font-size: 10px; letter-spacing: .14em; font-weight: 500; opacity: .8; }
    .p-birth { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; border: 1px solid #DEDBEC; border-radius: 13px; padding: 12px 16px; }
    .p-birth .l { flex: 1; font-size: 13px; font-weight: 700; color: #000000; }
    .p-birth input { background: rgba(36,27,69,.05); border: 1px solid #DEDBEC; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; color: #000000; font-family: 'Satoshi', sans-serif; }
    .p-bio-edit { margin-bottom: 22px; }
    .p-bio-edit textarea { width: 100%; background: rgba(36,27,69,.05); border: 1px solid #DEDBEC; border-radius: 12px; padding: 12px 15px; font-size: 13.5px; line-height: 1.55; color: #000000; font-family: 'Satoshi', sans-serif; resize: vertical; }
    .p-bio-edit textarea:focus { outline: none; border-color: #40319F; }
    .p-stats { display: flex; border-top: 1px solid rgba(36,27,69,.07); padding-top: 18px; }
    .p-stats > div { flex: 1; }
    .p-stats > div + div { border-left: 1px solid rgba(36,27,69,.07); padding-left: 18px; }
    .p-stats .n { font-size: 20px; font-weight: 700; color: #000000; }
    .p-stats .l { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #3F3A55; }
    .p-int-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .p-int-head .t { font-size: 17px; font-weight: 700; color: #000000; }
    .p-int-head .s { font-size: 11.5px; color: #3F3A55; }
    .p-int { display: flex; flex-direction: column; gap: 8px; }
    .p-int-row { display: flex; gap: 13px; align-items: center; border: 1px solid rgba(36,27,69,.07); border-radius: 14px; padding: 13px 16px; }
    .p-int-row .lg { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
    .p-int-row .t { font-size: 13.5px; font-weight: 700; }
    .p-int-row .f { font-size: 11.5px; color: #3F3A55; }
    .p-int-row .f b { color: #40319F; font-weight: 700; }
    .p-int-row .st { font-size: 11px; padding: 5px 12px; border-radius: 99px; flex-shrink: 0; }
    .p-empty { border: 1px dashed #DEDBEC; border-radius: 14px; padding: 22px; text-align: center; font-size: 12.5px; color: #3F3A55; }
    .p-empty b { color: #40319F; font-weight: 700; }
    /* Profile edit mode reuses the onboarding controls at the smaller sizes of l.551–604 */
    .compact .sel-list { margin-bottom: 18px; }
    .compact .sel-row { padding: 8px 10px 8px 15px; }
    .compact .sel-name { font-size: 13px; }
    .compact .speak { padding: 5px 12px; font-size: 10.5px; }
    .compact .lvls button { padding: 5px 11px; font-size: 10.5px; }
    .compact .remove { font-size: 12px; }
    .compact .groups { gap: 30px; margin-bottom: 28px; }
    .compact .custom-row .input { padding: 11px 15px; font-size: 13px; }
    .compact .add-btn { padding: 0 20px; font-size: 12.5px; }
    .compact .hint { font-size: 11px; margin-top: 8px; }
    .compact input[type="range"] { margin-bottom: 6px; }
    .compact .ticks { margin-bottom: 20px; }
    .compact .days { margin-bottom: 18px; }
    .compact .days button { height: 40px; }
    .compact .times { margin-bottom: 12px; }
    .compact .summary { margin-bottom: 24px; }

    /* ═══════════ CHAT — Zhody l.478–513 · Správy firmy l.708–743 ═══════════ */
    .chat-wrap { max-width: 980px; margin: 0 auto; padding-top: 36px; }
    .a-title .sub { font-size: 12px; color: #3F3A55; }

    // Card actions — l.1577–1584; skill / availability toggles inside the profile editor
    document.getElementById('a-main').addEventListener('click', e => {

        render(); return;
      }
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const d = el.dataset, a = d.act;

      if (d.job) {                                                                 // feed cards — l.1577–1584
        const j = JOBS.find(x => x.id === +d.job);
        if (a === 'open')   { state.detail = j; render(); }
        if (a === 'like')   act(j, 'like');
        if (a === 'skip')   act(j, 'skip');
        if (a === 'menu')   { state.rowMenu = state.rowMenu === 'j' + j.id ? null : 'j' + j.id; render(); }
        if (a === 'report') showToast('Inzerát sme nahlásili — pozrieme sa na to.');
        if (a === 'block')  { state.blockedFirms.push(j.f); showToast('Firmu sme skryli z tvojho feedu.'); }
      }
      else if (d.cand) {                                                           // candidates — l.1342–1364
        const c = CANDS.find(x => x.id === +d.cand);
        if (a === 'menu')   { state.rowMenu = state.rowMenu === 'c' + c.id ? null : 'c' + c.id; render(); }
        if (a === 'report') showToast('Profil sme nahlásili — pozrieme sa na to.');
        if (a === 'block')  { state.blocked.push(c.id); showToast('Profil zablokovaný.'); }
        if (a === 'contact') {
          if (!state.authed) { state.gate = true; render(); return; }
          state.contacted.push(c.id);
          if (!state.fchats.some(f => f.candId === c.id))
            state.fchats.push({ candId: c.id, name: c.n, job: c.offer, ini: c.ini, lg: c.g,
              msgs: [{ me: true, txt: `Dobrý deň, váš profil nás zaujal — máte záujem o pozíciu ${c.offer}?` }] });
          render();
        }
      }
      else if (d.offer) {                                                          // company postings — l.1372–1383
        const i = +d.offer, o = state.offers[i];
        if (a === 'toggle') { o.on = !o.on; render(); }
        if (a === 'menu')   { state.rowMenu = state.rowMenu === 'o' + i ? null : 'o' + i; render(); }
        if (a === 'dup')    { state.offers.splice(i + 1, 0, { ...o, t: o.t + ' (kópia)', views: 0, likes: 0, m: 0 }); showToast('Inzerát zduplikovaný.'); }
        if (a === 'askDel') { state.rowMenu = null; state.delIdx = i; render(); }
      }
      else if (a === 'type') { toggleInList(state.fTypes, d.type); render(); }    // posting type chips — l.1297–1302
    });

    function dock() {                                        // l.929–941, logic l.1308–1326
      const tabs = isStudent() ? STUDENT_TABS : FIRM_TABS;
      const active = isStudent() ? state.tab : (state.ftab === 9 ? 2 : state.ftab);
      const n = tabs.length;
      const notchLeft = ((active * 2 + 1) / (2 * n) * 430 - 37).toFixed(1) + 'px';
      return `<div class="dock">
        <div class="bg" style="-webkit-mask-position:${notchLeft} -38px, 0 0; mask-position:${notchLeft} -38px, 0 0"></div>
        <div class="tabs">${tabs.map(([label, glyph], i) => `
          <button class="${i === active ? 'on' : ''}" data-tab="${i}"><span class="glyph">${glyph}</span><span class="lbl">${label}</span></button>`).join('')}</div>
      </div>`;
    }
    document.getElementById('a-dock').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      const i = +b.dataset.tab;
      const active = isStudent() ? state.tab : (state.ftab === 9 ? 2 : state.ftab);
      if (i === active) return;
      if (isStudent()) state.tab = i; else state.ftab = i;
      startLoad();
    });

    function layers() {                                      // banner l.946, toast l.954, gate l.972, detail l.988
      let h = '';
      if (state.banner) h += `<div class="banner" role="status"><div class="ok">✓</div>
        <div><b>Máte zhodu!</b><span class="s">${esc(state.bannerName)} má o teba záujem.</span></div>
        <button data-go="bannerGo">Napísať správu</button></div>`;
      if (state.toast) h += `<div class="toast">${esc(state.toast)}</div>`;
      if (state.delIdx !== null && state.offers[state.delIdx]) h += `<div class="overlay del" data-go="delCancel"><div class="delm" data-go="noop">
        <div class="h">Zmazať „${esc(state.offers[state.delIdx].t)}"?</div>
        <div class="p">Inzerát aj jeho zhody sa nedajú vrátiť. Ak ho chcete len stiahnuť, použite Pozastaviť.</div>
        <div class="col"><button class="b1" data-go="delConfirm">Zmazať natrvalo</button><button class="b2" data-go="delCancel">Zrušiť</button></div></div></div>`;
      if (state.gate) h += `<div class="overlay" data-go="gateClose"><div class="gate" data-go="noop">
        <div class="ic">♥</div>
        <div class="h">Ešte krôčik — potrebujeme vedieť, kto si</div>
        <div class="p">Bez účtu nevieme komu ponuku priradiť. Registrácia trvá pár sekúnd a tvoj záujem odošleme hneď po nej.</div>
        <div class="col"><button class="b1" data-go="gateSignup">Vytvoriť účet</button>
          <button class="b2" data-go="gateLogin">Už mám účet — prihlásiť sa</button>
          <button class="b3" data-go="gateClose">Zrušiť</button></div></div></div>`;
      const d = state.detail;
      if (d) h += `<div class="overlay detail" data-go="closeDetail"><div class="dmodal" data-go="noop">
        <div class="top"><div class="who"><div class="lg" style="background:${d.lg}">${d.ini}</div>
          <div><div class="t">${esc(d.t)}</div><div class="f">${esc(d.f)} · <b>★ ${d.rat}</b> (${d.ratN} hodnotení)</div></div></div>
          <button class="x" data-go="closeDetail">✕</button></div>
        <div class="chips">${d.badges.map(b => `<span class="badge">${esc(b)}</span>`).join('')}${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="payrow"><div class="pay">${d.pay} <small>/ hod</small></div><span class="need">${needTxt(d)}</span></div>
        <p>${esc(d.desc)}</p>
        <div class="sec">Icebreakery</div>
        <div class="ice">${d.ice.map(i => `<div>${esc(i)}</div>`).join('')}</div>
        <div class="sec">Deň v práci</div>
        <div class="day"><div>foto 1</div><div>foto 2</div><div>foto 3</div></div>
        <div class="act"><button class="like" data-go="detailLike">♥ Mám záujem</button><button class="skip" data-go="detailSkip">✕ Preskočiť</button></div>
      </div></div>`;
      return h;
    }
    go.noop = () => {};                                      // clicks inside a modal don't close it (l.1668 `stop`)

    // README: top bar hides on scroll down and returns on scroll up.
    (() => {
      const c = document.getElementById('a-content'), hdr = document.getElementById('a-hdr');
      let last = 0;
      c.addEventListener('scroll', () => {
        const y = c.scrollTop;
        hdr.classList.toggle('hide', y > last && y > 80);
        last = y;
      });
    })();

    // ─── OB ───
    document.getElementById('ob-back').addEventListener('click', () => { if (state.obStep > 1) state.obStep--; else state.screen = 'pick'; render(); });
    document.getElementById('ob-next').addEventListener('click', () => {           // l.1566–1570
      if (state.obStep === 2 && state.obSkills.length < 1) return;
      if (state.obStep < 3) { state.obStep++; render(); }
      else enterApp({ tab: 0 });
    });
    function renderOb() {
      document.getElementById('ob-no').textContent = state.obStep;
      [...document.getElementById('ob-dots').children].forEach((d, i) => d.classList.toggle('on', state.obStep >= i + 1));
      const next = document.getElementById('ob-next');
      next.textContent = state.obStep === 3 ? 'Hotovo — pozri ponuky' : 'Pokračovať';
      next.style.opacity = (state.obStep === 2 && state.obSkills.length < 1) ? .45 : 1;
      if (state.obStep === 1) obStep1();
      if (state.obStep === 2) obStep2();
      if (state.obStep === 3) obStep3();
    }
    const obEl = document.getElementById('ob-step');
    function obStep1() {                                     // l.111–119
      obEl.innerHTML = `
        <h2>Ako sa <b>voláš?</b></h2>
        <p class="desc" style="margin-bottom:26px">Žiadne CV, žiadny motivačný list. Stačí meno a fotka.</p>
        <div class="s1-row"><div class="avatar" id="avatar">${initials()}</div>
          <div class="col"><input class="input" id="ob-name" placeholder="Meno a priezvisko" value="${esc(state.obName)}">
            <button class="photo-btn" type="button">Nahrať fotku (voliteľné)</button></div></div>`;
      const nameEl = document.getElementById('ob-name');
      nameEl.addEventListener('input', () => { state.obName = nameEl.value; document.getElementById('avatar').textContent = initials(); });
      obEl.onclick = null;
    }
    function initials() {                                    // l.1247–1248
      const name = state.obName.trim() || 'Tomáš Novák';
      return name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }
    function obStep2() {                                     // l.123–162
      obEl.innerHTML = `
        <h2>Čo ti <b>ide?</b></h2>
        <p class="desc" style="margin-bottom:22px">Vyber si koľko chceš — a pri každej nastav, ako dobre ju ovládaš. Robiq sa učí z každého kliku.</p>
        ${skillsEditor()}`;
      obEl.onclick = e => { const el = e.target.closest('button'); if (el) editorClick(el); };
      bindEditors();
    }
    function obStep3() {                                     // l.166–188
      obEl.innerHTML = `
        <h2>Koľko hodín <b>máš?</b></h2>
        <p class="desc" style="margin-bottom:30px">Ponuky uvidíš len podľa svojej reálnej dostupnosti.</p>
        <div class="hours-label" id="hours-label">${HOURS[state.obHours]}</div>
        ${availabilityEditor()}`;
      obEl.onclick = e => { const el = e.target.closest('button'); if (el) editorClick(el); };
      bindEditors();
    }

    // ─── Shared editors: used by onboarding steps 2–3 and by the profile in edit mode ───
    function skillsEditor() {                                // l.126–162, logic l.1256–1296
      const selNames = state.obSkills.map(x => x.n);
      const rows = state.obSkills.map((x, i) => {
        const isLang = LANGS.includes(x.n), speakOn = x.speak !== false;
        const lvls = (isLang ? LANG_LVLS : LVLS).map((L, li) => `<button type="button" class="${x.lvl === li + 1 ? 'on' : ''}" data-lvl="${i}:${li + 1}">${L}</button>`).join('');
        return `<div class="sel-row"><div class="sel-name">${esc(x.n)}</div>
          <button type="button" class="speak ${speakOn ? 'on' : ''}" data-speak="${i}" style="display:${isLang ? 'inline-block' : 'none'}">${speakOn ? '✓ Rozprávam' : 'Rozprávam'}</button>
          <div class="lvls">${lvls}</div><button type="button" class="remove" aria-label="Odstrániť" data-remove="${i}">✕</button></div>`;
      }).join('');
      const groups = GROUPS.map(gr => {
        const sugg = [];
        state.obSkills.forEach(x => { if (!gr.items.includes(x.n)) return;
          (RELATED[x.n] || []).forEach(r => { if (!selNames.includes(r) && !SKILLS.includes(r) && !sugg.includes(r)) sugg.push(r); }); });
        const chips = gr.items.filter(n => !selNames.includes(n)).map(n => `<button type="button" class="chip" data-add="${esc(n)}">＋ ${esc(n)}</button>`)
          .concat(sugg.map(n => `<button type="button" class="chip sugg" data-add="${esc(n)}">✦ ${esc(n)}</button>`));
        return chips.length ? `<div><div class="group-title">${gr.g}</div><div class="chips">${chips.join('')}</div></div>` : '';
      }).join('');
      return `${rows ? `<div class="sel-list">${rows}</div>` : ''}
        <div class="groups">${groups}
          <div><div class="group-title">Niečo iné?</div>
            <div class="custom-row"><input class="input" id="custom" placeholder="Napíš vlastnú zručnosť a stlač Enter…" value="${esc(state.customSkill)}"><button type="button" class="add-btn" id="add-custom">Pridať</button></div>
            <div class="hint">Všetko, čo sem napíšeš, použije Robiq pri AI párovaní s ponukami.</div></div></div>`;
    }
    function availabilityEditor() {                          // l.169–188, logic l.1542–1563
      return `<input type="range" id="hours" min="0" max="3" step="1" value="${state.obHours}">
        <div class="ticks"><span>5 h</span><span>10 h</span><span>20 h</span><span>Fulltime</span></div>
        <div class="label">Ktoré dni?</div>
        <div class="days">${DAYS.map(d => `<button type="button" class="${state.availDays.includes(d) ? 'on' : ''}" data-day="${d}">${d}</button>`).join('')}</div>
        <div class="label">Kedy počas dňa?</div>
        <div class="times">${TIMES.map(([t, sub]) => `<button type="button" class="${state.availTimes.includes(t) ? 'on' : ''}" data-time="${t}"><span>${t}</span><small>${sub}</small></button>`).join('')}</div>
        <div class="summary">${availSummary()}</div>`;
    }
    // Buttons inside the editors carry data-* attributes; returns true when it handled the click.
    function editorClick(el) {
      if (el.dataset.add)    { addSkill(el.dataset.add); return true; }
      if (el.dataset.remove) { state.obSkills.splice(+el.dataset.remove, 1); render(); return true; }
      if (el.dataset.speak)  { const s = state.obSkills[+el.dataset.speak]; s.speak = !(s.speak !== false); render(); return true; }
      if (el.dataset.lvl)    { const [i, l] = el.dataset.lvl.split(':'); state.obSkills[+i].lvl = +l; render(); return true; }
      if (el.dataset.day)    { toggleInList(state.availDays, el.dataset.day); render(); return true; }
      if (el.dataset.time)   { toggleInList(state.availTimes, el.dataset.time); render(); return true; }
      if (el.id === 'add-custom') { addCustom(); return true; }
      return false;
    }
    // Text fields update state while typing (no re-render, so the caret stays). Call after the editor HTML is in the page.
    function bindEditors() {
      const custom = document.getElementById('custom');
      if (custom) {
        custom.addEventListener('input', () => { state.customSkill = custom.value; });
        custom.addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });
      }
      const hours = document.getElementById('hours');
      if (hours) hours.addEventListener('input', () => {
        state.obHours = +hours.value;
        for (const id of ['hours-label', 'p-hours']) { const el = document.getElementById(id); if (el) el.textContent = HOURS[state.obHours]; }
      });
      const birth = document.getElementById('p-birth');
      if (birth) birth.addEventListener('input', () => { state.birth = birth.value; });
      const bio = document.getElementById('p-bio');
      if (bio) bio.addEventListener('input', () => { state.bio = bio.value; });
    }
    function addSkill(n) { if (!state.obSkills.some(x => x.n === n)) { state.obSkills.push({ n, lvl: 2, speak: true }); state.customSkill = ''; } render(); }
    function addCustom() { const n = state.customSkill.trim(); if (n) addSkill(n); }
    function availSummary() {                                // l.1558–1563
      const d = state.availDays, t = state.availTimes;
      if (!d.length && !t.length) return 'Vyber si dni a časy, kedy môžeš pracovať.';
      const dd = d.length === 7 ? 'každý deň' : (d.length ? d.join(', ') : 'dni podľa dohody');
      return dd + (t.length ? ' · ' + t.join(', ').toLowerCase() : '');
    }

    // ─── FOB ───
    function fobCanContinue() {
      if (state.fobStep === 1) return state.fobName.trim() !== '';
      if (state.fobStep === 2) return state.fobFields.length > 0;
      return state.fobTerms;
    }
    document.getElementById('fob-back').addEventListener('click', () => { if (state.fobStep > 1) state.fobStep--; else state.screen = 'pick'; render(); });
    document.getElementById('fob-next').addEventListener('click', () => {          // l.1480–1490
      if (!fobCanContinue()) return;
      if (state.fobStep < 3) { state.fobStep++; render(); return; }
      enterApp({ role: 'firm', ftab: 0, fpName: state.fobName.trim(), fpLogo: state.fobLogo,
                 fpDesc: '', fpVerified: false, offers: [], contacted: [], fchats: [] });      // l.1486–1488: no demo data
    });
    function renderFob() {
      document.getElementById('fob-no').textContent = state.fobStep;
      [...document.getElementById('fob-dots').children].forEach((d, i) => d.classList.toggle('on', state.fobStep >= i + 1));
      const next = document.getElementById('fob-next');
      next.textContent = state.fobStep === 3 ? 'Vytvoriť firemný účet' : 'Pokračovať';
      next.style.opacity = fobCanContinue() ? 1 : .45;
      if (state.fobStep === 1) fobStep1();
      if (state.fobStep === 2) fobStep2();
      if (state.fobStep === 3) fobStep3();
    }
    const fobEl = document.getElementById('fob-step');
    function fobStep1() {                                    // l.244–256
      fobEl.innerHTML = `
        <h2>Kto <b>ste?</b></h2>
        <p class="desc" style="margin-bottom:24px">Overíme firmu podľa IČO — ľudia tak vedia, že píšu reálnemu zamestnávateľovi.</p>
        <div class="f1-row"><label class="flogo" id="flogo" title="Nahrať logo"><span id="flogo-init"></span><span class="tag">LOGO</span><input type="file" accept="image/*" id="flogo-file"></label>
          <div class="col"><input class="input" id="fob-name" placeholder="Názov firmy" value="${esc(state.fobName)}"><input class="input" id="fob-ico" placeholder="IČO" value="${esc(state.fobIco)}"></div></div>`;
      paintLogo();
      const nameEl = document.getElementById('fob-name');
      nameEl.addEventListener('input', () => { state.fobName = nameEl.value; paintLogo(); document.getElementById('fob-next').style.opacity = fobCanContinue() ? 1 : .45; });
      bindInput('fob-ico', 'fobIco');
      document.getElementById('flogo-file').addEventListener('change', e => {      // l.1460–1464
        const f = e.target.files && e.target.files[0]; if (!f) return;
        state.fobLogo = URL.createObjectURL(f); paintLogo();
      });
      fobEl.onclick = null;
    }
    function paintLogo() {                                   // l.1457–1459
      const logo = document.getElementById('flogo'), init = document.getElementById('flogo-init'); if (!logo) return;
      init.textContent = (state.fobName.trim() || '?').slice(0, 1).toUpperCase();
      init.style.display = state.fobLogo ? 'none' : 'block';
      logo.style.backgroundImage = state.fobLogo ? `url(${state.fobLogo})` : 'none';
    }
    function fobStep2() {                                    // l.261–268
      fobEl.innerHTML = `
        <h2>Koho <b>hľadáte?</b></h2>
        <p class="desc" style="margin-bottom:22px">Podľa toho vám Robiq predvyberie ľudí. Dá sa kedykoľvek zmeniť.</p>
        <div class="label" style="margin-bottom:11px">Odvetvie</div>
        <div class="fchips">${FIELDS.map(f => `<button type="button" class="fchip ${state.fobFields.includes(f) ? 'on' : ''}" data-field="${esc(f)}">${esc(f)}</button>`).join('')}</div>`;
      fobEl.onclick = e => { const el = e.target.closest('button[data-field]'); if (!el) return; toggleInList(state.fobFields, el.dataset.field); render(); };
    }
    function fobStep3() {                                    // l.272–282
      fobEl.innerHTML = `
        <h2>Kontaktná <b>osoba</b></h2>
        <p class="desc" style="margin-bottom:24px">Komu majú chodiť správy od záujemcov.</p>
        <div class="f3-col"><input class="input" id="fob-contact" placeholder="Meno a priezvisko" value="${esc(state.fobContact)}">
          <input class="input" id="fob-email" type="email" placeholder="Pracovný e-mail" value="${esc(state.fobEmail)}">
          <input class="input" id="fob-pass" type="password" placeholder="Heslo" value="${esc(state.fobPass)}"></div>
        <button type="button" class="terms ${state.fobTerms ? 'on' : ''}" id="terms"><span class="box">${state.fobTerms ? '✓' : ''}</span>
          <span class="txt">Súhlasím s podmienkami Robiq a potvrdzujem, že som oprávnený zastupovať túto firmu.</span></button>`;
      bindInput('fob-contact', 'fobContact'); bindInput('fob-email', 'fobEmail'); bindInput('fob-pass', 'fobPass');
      document.getElementById('terms').addEventListener('click', () => { state.fobTerms = !state.fobTerms; render(); });
      fobEl.onclick = null;
    }

    // ═══════════ Helpers ═══════════
    function bindInput(id, key) { const el = document.getElementById(id); el.addEventListener('input', () => { state[key] = el.value; }); }
    function toggleInList(list, item) { const i = list.indexOf(item); if (i === -1) list.push(item); else list.splice(i, 1); }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // ═══════════ Login background — l.1173–1213, verbatim ═══════════
    const M = 12, R = 430, CX = 450, CY = 450, SEG = 90;
    const cvL = document.querySelector('canvas[data-dot="L"]'), cvR = document.querySelector('canvas[data-dot="R"]');
    function draw(cv, t, mirror) {
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, 900, 900);
      const g = ctx.createLinearGradient(mirror ? CX + R : CX - R, 0, mirror ? CX - R : CX + R, 0);
      g.addColorStop(0, 'rgba(64,49,159,.55)'); g.addColorStop(.5, 'rgba(124,108,224,.8)'); g.addColorStop(1, 'rgba(203,192,255,.95)');
      ctx.strokeStyle = g;
      const T = t * 60;
      for (let k = 0; k < M; k++) {
        const p = ((k / M + T * 0.05) % 1 + 1) % 1, r = 40 + p * (R - 40), fade = Math.sin(p * Math.PI);
        ctx.globalAlpha = fade * 0.85; ctx.lineWidth = 1 + fade * 1.2;
        const amp = 6 + 10 * p;
        ctx.beginPath();
        for (let i = 0; i <= SEG; i++) {
          const a = (i / SEG) * Math.PI * 2;
          const rr = r + amp * Math.sin(a * 5 + T * 0.9 + k * 1.7) + amp * 0.5 * Math.sin(a * 3 - T * 0.6 + k);
          const x = CX + rr * Math.cos(a), y = CY + rr * Math.sin(a);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath(); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    function loop(now) {
      requestAnimationFrame(loop);
      if (state.screen !== 'login') return;
      const t = now * 0.000016;
      draw(cvL, t, false); draw(cvR, 1e6 - t * 0.85, true);
    }
    requestAnimationFrame(loop);

    render();
  </script>
</body>
